<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Kindle Note</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f3ee;color:#222;font:16px/1.6 system-ui,sans-serif}main{max-width:640px;margin:48px auto;padding:0 24px}h1{font-size:30px;letter-spacing:-1px;margin-bottom:8px}.sub{color:#666;margin-top:0}section{background:#fff;padding:24px;border:1px solid #dedbd3;border-radius:16px;margin-top:24px}label{display:block;margin-bottom:8px}input,textarea{font:inherit;width:100%;border:1px solid #b9b7af;border-radius:8px;padding:12px;background:#fff;color:#222}textarea{min-height:280px;resize:vertical}button{font:inherit;border:0;border-radius:8px;padding:12px 20px;background:#292f28;color:white;cursor:pointer;min-height:48px}button:disabled{opacity:.5;cursor:wait}.row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:16px}.muted,small{color:#666}.secondary{background:#ecebe6;color:#333}#status{min-height:26px}#count{font-variant-numeric:tabular-nums}a{color:inherit}input:focus,textarea:focus,button:focus-visible{outline:3px solid #88a27a;outline-offset:2px}[hidden]{display:none!important}@media(max-width:480px){main{margin:24px auto;padding:0 16px}section{padding:18px}.row{flex-wrap:wrap}}
</style></head><body><main><h1>Kindle Note</h1><p class="sub">把想记住的事，留在桌面上。</p>
<section id="login"><form id="loginForm"><label for="key">管理钥匙</label><input id="key" type="password" autocomplete="off" spellcheck="false" required><p class="muted">这是你的私人便签。请使用专属入口，或粘贴管理钥匙。</p><button type="submit" id="unlock">打开便签</button></form></section>
<section id="editor" hidden><form id="noteForm"><label for="note">我的便签</label><textarea id="note" placeholder="写下一件重要的事……" spellcheck="false"></textarea><div class="row"><small id="count">0 / 800</small><small>支持中文、英文和换行</small></div><div class="row"><button id="save" type="submit">保存到 Kindle</button><button id="logout" type="button" class="secondary">退出</button></div></form><p class="muted">保存后会在 Kindle 下一次成功联网时更新，通常需要数分钟。离线时保留原内容。长便签可能在屏幕上截断，完整文字仍会保存。</p><small>本页只修改便签，不会用手机的位置覆盖 Kindle 的城市。</small></section>
<p id="status" role="status" aria-live="polite"></p><p class="muted"><small>专属入口包含管理钥匙，请勿公开分享。钥匙仅保留在当前标签页内存中，刷新页面后需重新打开专属入口。</small></p></main><script src="/editor.js" defer></script></body></html>
